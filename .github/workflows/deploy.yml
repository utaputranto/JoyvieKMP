name: Deploy Android to Firebase App Distribution

on:
  pull_request:
    branches:
      - development
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for this build'
        required: false
        default: 'Manual trigger deployment'

jobs:
  deploy-android:
    name: Build & Deploy Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v4.5.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload to Firebase App Distribution
        uses: w9jds/firebase-action@v2.2.0
        with:
          args: appdistribution:distribute androidApp/build/outputs/apk/debug/androidApp-debug.apk --app ${{ secrets.FIREBASE_APP_ID_ANDROID }} --groups "tester-dev" --release-notes "${{ github.event.inputs.release_notes }}"
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
